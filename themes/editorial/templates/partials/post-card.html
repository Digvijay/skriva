{{define "post-card"}}
<article class="post-card">
{{if .Image}}<img src="/media/{{.Slug}}/{{.Image}}" alt="{{.Title}}" loading="lazy">{{end}}
<div class="post-card-body">
<h2><a href="{{.Permalink}}">{{.Title}}</a></h2>
<div class="post-meta">
<time>{{formatDate .Date "Jan 2, 2006"}}</time> · {{readingTime .}}
</div>
{{if .Description}}<p>{{truncate .Description 160}}</p>{{end}}
{{if .Tags}}
<div class="tags">
{{range .Tags}}<a href="/tag/{{slugify .}}">{{.}}</a>{{end}}
</div>
{{end}}
</div>
</article>
{{end}}
