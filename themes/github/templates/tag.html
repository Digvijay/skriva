{{template "base" .}}
{{define "content"}}
<div class="container">
<header class="section-header">
<h1>
<svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" class="octicon"><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
Posts tagged &ldquo;{{.Tag.Name}}&rdquo;
</h1>
<p class="section-desc">{{.Tag.Count}} post{{if ne .Tag.Count 1}}s{{end}} found</p>
</header>

<section class="posts-feed">
{{range .Posts}}
{{template "post-card" .}}
{{end}}
</section>

<div class="back-link">
<a href="/" class="btn btn-outline">&larr; Back to all posts</a>
</div>
</div>
{{end}}
