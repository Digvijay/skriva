{{define "nav"}}
<header class="site-header">
<div class="container header-inner">
<div class="header-left">
<a href="/" class="site-logo">
<svg height="24" viewBox="0 0 16 16" width="24" class="octicon" aria-hidden="true">
<path fill="currentColor" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
</svg>
<span class="site-title">{{.Site.Title}}</span>
</a>
{{if .Site.Tagline}}<span class="site-tagline">{{.Site.Tagline}}</span>{{end}}
</div>
<div class="header-right">
<nav class="site-nav">
<a href="/" {{if eq .Nav.ActiveSection "home"}}class="active"{{end}}>Blog</a>
<a href="/archive" {{if eq .Nav.ActiveSection "archive"}}class="active"{{end}}>Archive</a>
<a href="/search" {{if eq .Nav.ActiveSection "search"}}class="active"{{end}}>Search</a>
{{if .Site.Social.Github}}<a href="https://github.com/{{.Site.Social.Github}}" target="_blank" rel="noopener">GitHub</a>{{end}}
<a href="/rss.xml" title="RSS Feed">RSS</a>
</nav>
<button class="theme-toggle" onclick="toggleColorMode()" aria-label="Toggle color mode">
<span class="theme-toggle-icon"></span>
</button>
<button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.site-nav').classList.toggle('open')">
<svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
</button>
</div>
</div>
</header>
{{end}}
