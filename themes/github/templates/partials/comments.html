{{define "comments"}}
<section class="comments-section" id="comments">
<h2 class="comments-heading">
<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="octicon"><path d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 13.25 12H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 13.543V12H2.75A1.75 1.75 0 0 1 1 10.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h4.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
Comments {{if .Comments}}({{len .Comments}}){{end}}
</h2>

{{if .Comments}}
<div class="comments-list">
{{range .Comments}}
<div class="comment">
<div class="comment-avatar">
<svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" class="octicon"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg>
</div>
<div class="comment-body">
<div class="comment-header">
<strong class="comment-author">{{.Author}}</strong>
<span class="comment-date">commented on <time datetime="{{.CreatedAt.Format "2006-01-02"}}">{{formatDate .CreatedAt "Jan 2, 2006"}}</time></span>
</div>
<div class="comment-content">{{.Content}}</div>
</div>
</div>
{{end}}
</div>
{{end}}

<div class="comment-form-wrapper">
<h3>Leave a comment</h3>
<form action="/api/comment/{{.Post.Slug}}" method="POST" class="comment-form">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<div class="form-row">
<div class="form-group">
<label for="author">Name <span class="required">*</span></label>
<input type="text" id="author" name="author" required maxlength="100" class="form-control">
</div>
<div class="form-group">
<label for="email">Email <span class="optional">(optional)</span></label>
<input type="email" id="email" name="email" maxlength="200" class="form-control">
</div>
</div>
<!-- Honeypot -->
<div style="position:absolute;left:-9999px"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
<div class="form-group">
<label for="content">Comment <span class="required">*</span></label>
<textarea id="content" name="content" rows="4" required maxlength="5000" class="form-control"></textarea>
</div>
<button type="submit" class="btn btn-primary">Comment</button>
</form>
</div>
</section>
{{end}}
