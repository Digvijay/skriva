{{define "reactions"}}
<div class="reactions-bar" data-slug="{{.Post.Slug}}">
<div class="reactions-group">
<button class="reaction-btn" onclick="react('like','{{.Post.Slug}}')" title="Like">
<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="octicon"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
<span id="likes">{{if .Stats}}{{.Stats.Likes}}{{else}}0{{end}}</span>
</button>
<button class="reaction-btn" onclick="react('dislike','{{.Post.Slug}}')" title="Dislike">
<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="octicon"><path d="M8 12a1 1 0 0 1-.707-.293l-4.5-4.5a1 1 0 0 1 1.414-1.414L8 9.586l3.793-3.793a1 1 0 0 1 1.414 1.414l-4.5 4.5A1 1 0 0 1 8 12Z"/></svg>
<span id="dislikes">{{if .Stats}}{{.Stats.Dislikes}}{{else}}0{{end}}</span>
</button>
</div>
{{if .Stats}}<span class="view-count">
<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="octicon"><path d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.824.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/></svg>
{{.Stats.Views}} views
</span>{{end}}
</div>
<script>
async function react(type, slug){
  try{
    const res = await fetch('/api/reaction/'+slug, {method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':'{{.CSRFToken}}'}, body:JSON.stringify({type:type})});
    if(res.ok){
      const d = await res.json();
      document.getElementById('likes').textContent = d.likes;
      document.getElementById('dislikes').textContent = d.dislikes;
    }
  }catch(e){}
}
</script>
{{end}}
