{{define "share"}}
<div class="share-buttons">
<span class="share-label">Share:</span>
<a href="https://twitter.com/intent/tweet?url={{.Meta.CanonicalURL}}&text={{.Post.Title}}" target="_blank" rel="noopener" class="share-btn" title="Share on Twitter">Twitter</a>
<a href="https://www.linkedin.com/sharing/share-offsite/?url={{.Meta.CanonicalURL}}" target="_blank" rel="noopener" class="share-btn" title="Share on LinkedIn">LinkedIn</a>
<a href="https://bsky.app/intent/compose?text={{.Post.Title}}%20{{.Meta.CanonicalURL}}" target="_blank" rel="noopener" class="share-btn" title="Share on Bluesky">Bluesky</a>
<a href="mailto:?subject={{.Post.Title}}&body=Check out this post: {{.Meta.CanonicalURL}}" class="share-btn" title="Share via Email">Email</a>
<button class="share-btn" onclick="shareMastodon()" title="Share on Mastodon">Mastodon</button>
</div>
<script>
function shareMastodon(){
  var instance=prompt('Enter your Mastodon instance (e.g. mastodon.social):');
  if(instance){instance=instance.replace(/^https?:\/\//,'').replace(/\/$/,'');window.open('https://'+instance+'/share?text='+encodeURIComponent('{{.Post.Title}} {{.Meta.CanonicalURL}}'));}
}
</script>
{{end}}
