{{template "base" .}}
{{define "content"}}
<div class="container">
<header class="section-header">
<h1>Tags</h1>
<p class="section-desc">Browse all topics.</p>
</header>
<div class="tag-cloud" style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem">
{{range .Tags}}
<a href="/tag/{{.Slug}}" class="tag" style="padding:.4rem .8rem;border:1px solid var(--color-border);border-radius:20px;text-decoration:none;font-size:.9rem;color:var(--color-primary)">{{.Name}} <span style="color:var(--color-text-muted);font-size:.8rem">({{.Count}})</span></a>
{{end}}
</div>
</div>
{{end}}
