{{define "share"}}
<div class="share-buttons">
<span class="share-label">Share this post</span>
<div class="share-actions">
<a href="https://twitter.com/intent/tweet?url={{.Meta.CanonicalURL}}&text={{.Post.Title}}" target="_blank" rel="noopener" class="share-btn share-twitter" title="Share on Twitter">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
</a>
<a href="https://www.linkedin.com/sharing/share-offsite/?url={{.Meta.CanonicalURL}}" target="_blank" rel="noopener" class="share-btn share-linkedin" title="Share on LinkedIn">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
</a>
<a href="https://bsky.app/intent/compose?text={{.Post.Title}}%20{{.Meta.CanonicalURL}}" target="_blank" rel="noopener" class="share-btn share-bluesky" title="Share on Bluesky">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.5 14.5h-9v-2h9v2zm0-3.5h-9V11h9v2zm0-3.5h-9V7.5h9V9.5z"/></svg>
</a>
<a href="mailto:?subject={{.Post.Title}}&body=Check out this post: {{.Meta.CanonicalURL}}" class="share-btn share-email" title="Share via Email">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
</a>
<button class="share-btn share-mastodon" onclick="shareMastodon()" title="Share on Mastodon" style="background:none;border:none;color:inherit;cursor:pointer;padding:inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.268 5.313c-.35-2.578-2.617-4.61-5.304-5.004C17.51.242 15.792 0 11.813 0h-.03c-3.98 0-4.835.242-5.288.309C3.882.692 1.496 2.518.917 5.127.64 6.412.61 7.837.661 9.143c.074 1.874.088 3.745.26 5.611.118 1.24.325 2.47.62 3.68.55 2.237 2.777 4.098 4.96 4.857 2.336.792 4.849.923 7.256.38.265-.061.527-.132.786-.213.585-.184 1.27-.39 1.774-.753a.057.057 0 0 0 .023-.043v-1.809a.052.052 0 0 0-.02-.041.053.053 0 0 0-.046-.01 20.282 20.282 0 0 1-4.709.545c-2.73 0-3.463-1.284-3.674-1.818a5.593 5.593 0 0 1-.319-1.433.053.053 0 0 1 .066-.054 19.648 19.648 0 0 0 4.636.536c.564 0 1.127-.028 1.687-.083 1.867-.18 3.627-.533 3.628-.533l.084-.014c2.636-.353 4.845-2.117 5.12-4.577.114-.966.203-2.126.166-3.142 0-.05.04-2.455-.04-2.455Z"/></svg>
</button>
</div>
</div>
<script>
function shareMastodon(){
  var instance=prompt('Enter your Mastodon instance (e.g. mastodon.social):');
  if(instance){instance=instance.replace(/^https?:\/\//,'').replace(/\/$/,'');window.open('https://'+instance+'/share?text='+encodeURIComponent('{{.Post.Title}} {{.Meta.CanonicalURL}}'));}
}
</script>
{{end}}
