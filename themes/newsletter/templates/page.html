{{template "base" .}}
{{define "content"}}
<article class="page container">
<header class="page-header">
<h1 class="page-title">{{.Page.Title}}</h1>
{{if .Page.Description}}<p class="page-description">{{.Page.Description}}</p>{{end}}
</header>
<div class="page-content">
{{safeHTML .Page.HTML}}
</div>
</article>
{{end}}
